<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 160" width="420" height="160" role="img" aria-label="Rat Race">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#e9a82f"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#f5c451" stop-opacity=".55"/><stop offset="1" stop-color="#f5c451" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- wheel: the "rat race" -->
  <circle cx="74" cy="82" r="64" fill="url(#glow)" opacity=".5"/>
  <circle cx="68" cy="82" r="52" fill="none" stroke="#7c9cff" stroke-opacity=".55" stroke-width="6" stroke-dasharray="3 10" stroke-linecap="round"/>
  <circle cx="68" cy="82" r="44" fill="none" stroke="#eef3ff" stroke-opacity=".16" stroke-width="2"/>
  <path d="M68 38v88M24 82h88M37 51l62 62M99 51l-62 62" stroke="#eef3ff" stroke-opacity=".1" stroke-width="2"/>
  <!-- door: the way out -->
  <path d="M104 122V84a15 15 0 0 1 30 0v38z" fill="url(#gold)"/>
  <path d="M110 122V85a9 9 0 0 1 18 0v37z" fill="#0d1424" fill-opacity=".6"/>
  <circle cx="125" cy="104" r="1.8" fill="#ffe08a"/>
  <!-- rat, running -->
  <ellipse cx="62" cy="100" rx="20" ry="11" fill="#eef3ff"/>
  <circle cx="83" cy="94" r="8.5" fill="#eef3ff"/>
  <circle cx="80" cy="85.5" r="4.2" fill="#eef3ff"/>
  <circle cx="80" cy="85.5" r="2.2" fill="#f4a9b8"/>
  <path d="M90 94.5l6 1.6-6 1.4z" fill="#f4a9b8"/>
  <circle cx="86" cy="92.6" r="1.3" fill="#0d1424"/>
  <path d="M44 99c-12-1-20 5-18 17" fill="none" stroke="#eef3ff" stroke-width="3" stroke-linecap="round"/>
  <path d="M52 108l-8 12M72 109l6 11" fill="none" stroke="#eef3ff" stroke-width="3.2" stroke-linecap="round"/>
  <!-- wordmark -->
  <g font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-weight="800" letter-spacing="2">
    <text x="164" y="80" font-size="64" fill="#eef3ff">RAT</text>
    <text x="164" y="138" font-size="64" fill="url(#gold)">RACE</text>
  </g>
</svg>
